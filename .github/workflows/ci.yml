name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: dashboard
        run: pnpm lint

      - name: Type check
        working-directory: dashboard
        run: pnpm exec tsc --noEmit

      - name: Test
        working-directory: dashboard
        run: pnpm test

  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            agent/go.sum
            tui/go.sum

      - name: Test agent
        working-directory: agent
        run: go test ./...

      - name: Test TUI
        working-directory: tui
        run: go test ./...
